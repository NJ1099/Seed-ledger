# Render Blueprint — Seed (Liquid Ledger) 공개 배포판
#
# 사용법:
#   1. 이 저장소를 GitHub 에 푸시
#   2. render.com 대시보드 → New → Blueprint → 저장소 선택
#   3. Render 가 이 파일을 읽어 Web Service 자동 생성
#
# 주의:
#   - seed-public 폴더를 루트로 하는 별도 저장소로 배포하거나,
#     rootDir 를 "seed-public" 로 명시해서 모노레포 배포 둘 다 지원.
services:
  - type: web
    name: seed-public
    runtime: node                     # Blueprint 스펙에서 env 를 대체한 필드 (env 는 deprecated)
    region: singapore                 # 한국과 가장 가까운 리전
    plan: free                         # 무료 플랜. 트래픽 늘면 starter 로 승격 권장.
    rootDir: .                          # 같은 저장소 하위 폴더로 배포할 경우 "seed-public" 로 변경
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 신뢰하는 프록시 홉 수. 속도 제한이 접속자를 어떻게 식별할지 결정한다.
      # Render 는 앞에 프록시가 1단이므로 X-Forwarded-For 의 맨 오른쪽 값이 실제 접속자다.
      # (맨 왼쪽은 클라이언트가 위조해 보낼 수 있어 믿으면 IP 제한이 통째로 뚫린다.)
      # 앞에 CDN 을 더 붙이면 그 수만큼 올릴 것. 코드는 이 값이 없으면 RENDER 감지로 1을 쓴다.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # PORT 는 Render 가 주입함. 직접 설정 금지.
